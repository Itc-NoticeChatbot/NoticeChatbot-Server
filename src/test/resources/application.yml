gemini:
  api:
    key: test-api-key
    base-url: http://localhost
    timeout-seconds: 5

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:notice_server;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
